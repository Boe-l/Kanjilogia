name: Flutter Builds

on:
  push:
    branches:
      - source
    paths-ignore:
      - 'README.md'
      - 'README-en.md'
  pull_request:
    branches:
      - source
    paths-ignore:
    - 'README.md'
    - 'README-en.md'

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yaml

  build-android:
    uses: ./.github/workflows/build-android.yaml
  save-source:
    uses: ./.github/workflows/save-source.yaml